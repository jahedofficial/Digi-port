name: Production CI/CD & Hardening Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: 1. Code Quality, Typecheck & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma ORM Client
        run: npx prisma generate

      - name: Static Typecheck
        run: npx tsc --noEmit

      - name: Run Enterprise Test Suite (Phases 0–17)
        run: npm test
        env:
          NODE_ENV: test
          ENCRYPTION_SECRET: 'production_sample_encryption_secret_key_32chars!'
          JWT_SECRET: 'sample_jwt_secret_key_production'

      - name: Production Next.js Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  security_scan:
    name: 2. Container & Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo & Configs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          format: 'table'

  docker_build:
    name: 3. Multi-Stage Docker Build Verification
    runs-on: ubuntu-latest
    needs: security_scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: digiport-os:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 4. Zero-Downtime Production Deployment
    runs-on: ubuntu-latest
    needs: [validate, security_scan, docker_build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets['VPS_HOST'] }}
          username: ${{ secrets['VPS_USERNAME'] }}
          key: ${{ secrets['VPS_SSH_KEY'] }}
          port: ${{ secrets['VPS_PORT'] || 22 }}
          script: |
            set -e
            echo "🚀 [Deploy] Deploying DigiPort Universal Paid Media OS to VPS..."
            cd /var/www/Digi-port
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml build --no-cache digiport-app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
            echo "✅ [Deploy] DigiPort Production deployment completed successfully!"
